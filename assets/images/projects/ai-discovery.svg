  <path d="M132 231C132 221 150 221 150 232C150 239 140 238 140 246" stroke="#e2d5b6" stroke-width="4" stroke-linecap="round"/>
  <circle cx="140" cy="255" r="2.5" fill="#e2d5b6"/>
  <!-- Search lens with an evidence card and source markers. -->
  <circle cx="322" cy="177" r="77" stroke="#e8ae83" stroke-opacity=".12" stroke-width="15"/>
  <path d="M368 225L412 269" stroke="#0b2331" stroke-width="24" stroke-linecap="round"/>
  <path d="M368 225L412 269" stroke="#dca278" stroke-width="16" stroke-linecap="round"/>
  <circle cx="322" cy="177" r="66" fill="url(#lens)" stroke="#f2be91" stroke-width="7"/>
  <path d="M273 163C278 144 290 134 305 130" stroke="#f8dac0" stroke-width="4" stroke-linecap="round" opacity=".5"/>
  <rect x="290" y="148" width="64" height="59" rx="8" fill="#d1ded8"/>
  <path d="M302 162H342M302 174H333M302 186H324" stroke="#648b94" stroke-width="4" stroke-linecap="round"/>
  <circle cx="340" cy="204" r="12" fill="#ee947b" stroke="#193c4d" stroke-width="3"/>
  <path d="M335 204L339 208L346 200" stroke="#193c4d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Three matched experts, with the strongest result highlighted. -->
  <g stroke="#7195a2" stroke-width="2">
    <rect x="461" y="66" width="107" height="65" rx="12" fill="#203f50"/>
    <rect x="449" y="153" width="131" height="68" rx="12" fill="#294b59" stroke="#eaa080"/>
    <rect x="461" y="241" width="107" height="65" rx="12" fill="#203f50"/>
  </g>
  <g fill="#a5c4c7">
    <circle cx="485" cy="91" r="8"/><path d="M473 115C473 100 497 100 497 115Z"/>
    <circle cx="485" cy="265" r="8"/><path d="M473 289C473 274 497 274 497 289Z"/>
  </g>
