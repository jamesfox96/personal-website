  <rect x="73" y="64" width="97" height="112" rx="10" transform="rotate(-9 73 64)" fill="#203f50" stroke="#486c7f" stroke-width="2"/>
  <rect x="91" y="67" width="97" height="112" rx="10" fill="#c5d7d4" stroke="#0b2331" stroke-width="3"/>
  <path d="M108 87H136M108 135H169M108 148H154" stroke="#6f9397" stroke-width="5" stroke-linecap="round"/>
  <path d="M109 121L125 108L140 118L168 95" stroke="#356a78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="168" cy="95" r="5" fill="#e88972"/>
