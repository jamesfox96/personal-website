<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" fill="none">
  <defs>
    <linearGradient id="background" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#183c50"/><stop offset="1" stop-color="#081e2d"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#f4b58a" stop-opacity=".16"/><stop offset="1" stop-color="#f4b58a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lens" x2="1" y2="1">
      <stop stop-color="#31576a"/><stop offset="1" stop-color="#173747"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#background)"/>
  <ellipse cx="335" cy="181" rx="216" ry="176" fill="url(#glow)"/>
  <!-- A question enters the search; retrieved evidence connects to people. -->
  <g stroke="#658b99" stroke-width="2" stroke-dasharray="4 7" stroke-linecap="round">
    <path d="M170 119C225 119 203 169 259 169M181 251C228 251 214 202 261 202"/>
    <path d="M379 160C419 160 408 99 460 99M387 185H459M379 211C416 211 414 273 460 273"/>
  </g>
