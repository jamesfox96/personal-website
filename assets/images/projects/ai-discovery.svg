    <path d="M511 91H550M511 104H537M511 266H550M511 279H535"/>
    <path d="M505 178H562M505 192H542" stroke="#c5d7d4"/>
  </g>
  <g fill="#edb28b">
    <circle cx="222" cy="156" r="3"/><circle cx="423" cy="185" r="4"/>
    <path d="M399 80L402 88L410 91L402 94L399 102L396 94L388 91L396 88Z"/>
